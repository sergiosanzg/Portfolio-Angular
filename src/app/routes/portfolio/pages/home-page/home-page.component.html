<div
  class="landing"
  [style.--hero-progress]="heroProgress"
  [style.--background-drift]="backgroundDrift"
>
  <nav class="chip-nav" data-reveal>
    <button class="chip" [class.active]="activeSection === 'about'" type="button" (click)="scrollToAbout()">Profile</button>
    <button class="chip" [class.active]="activeSection === 'experience'" type="button" (click)="scrollToExperience()">Craft</button>
    <button class="chip" [class.active]="activeSection === 'projects'" type="button" (click)="scrollToProjects()">Projects</button>
    <button class="chip" [class.active]="activeSection === 'contact'" type="button" (click)="scrollToContact()">Contact</button>
  </nav>

  <portfolio-hero-section
    [text]="text"
    [skills]="skills"
    [heroProgress]="heroProgress"
    (projectsClick)="scrollToProjects()"
    (contactClick)="scrollToContact()"
  ></portfolio-hero-section>

  <portfolio-story-section
    [stats]="stats"
    [storyPanels]="storyPanels"
  ></portfolio-story-section>

  <portfolio-craft-section
    [capabilities]="capabilities"
    [timeline]="timeline"
  ></portfolio-craft-section>

  <portfolio-projects-section
    [projects]="projects"
  ></portfolio-projects-section>

  <portfolio-contact-section
    [contactLinks]="contactLinks"
    [isLoading]="isLoading"
    [statusMessage]="statusMessage"
    [statusType]="statusType"
    (formSubmit)="sendEmail($event)"
  ></portfolio-contact-section>

  <button
    class="scroll-top-btn"
    type="button"
    [class.is-visible]="showScrollTop"
    [attr.aria-hidden]="!showScrollTop"
    aria-label="Back to top"
    (click)="scrollToTop()"
  >
    <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
  </button>
</div>
