<section class="hero">
  <div class="hero-backdrop"></div>
  <div class="hero-overlay"></div>

  <div class="hero-shell">
    <div class="hero-copy" data-reveal>
      <span class="eyebrow">{{ content.eyebrow }}</span>
      <h1>{{ content.title }}</h1>
      <p class="lead">
        {{ content.leadPrefix }} {{ content.leadSuffix }}
      </p>

      <div class="cta-row">
        <button class="btn primary" type="button" (click)="projectsClick.emit()" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">{{ content.primaryCta }}</button>
        <button class="btn ghost" type="button" (click)="contactClick.emit()" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">{{ content.secondaryCta }}</button>
      </div>

      <div class="hero-signal">
        <span>{{ content.availability }}</span>
      </div>
    </div>

    <aside class="hero-panel" data-reveal>
      <div class="hero-panel-media">
        <img src="assets/img/foto2.webp" [alt]="content.portraitAlt" draggable="false" />
      </div>
      <div class="hero-panel-copy">
        <span class="panel-label">{{ content.panelLabel }}</span>
        <h2>{{ content.panelTitle }}</h2>
        <div class="skill-list">
          @for (skill of skills; track skill.name) {
          <div class="skill-pill">
            <img [src]="skill.icon" [alt]="skill.name + ' logo'" draggable="false" />
            <span>{{ skill.name }}</span>
          </div>
          }
        </div>
      </div>
    </aside>
  </div>
</section>
