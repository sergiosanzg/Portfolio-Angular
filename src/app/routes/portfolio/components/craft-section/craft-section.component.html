<section class="craft-section" id="experience">
  <div class="section-intro" data-reveal>
    <span class="eyebrow">{{ content.eyebrow }}</span>
    <h2>{{ content.title }}</h2>
  </div>

  <div class="craft-grid">
    @for (item of capabilities; track i; let i = $index) {
    <div class="capability-card" [style.--delay]="i * 120 + 'ms'" data-reveal>
      <span class="card-count">0{{ i + 1 }}</span>
      <h3>{{ item.title }}</h3>
      <p>{{ item.description }}</p>
    </div>
    }
  </div>

  <div class="timeline-grid">
    @for (step of timeline; track i; let i = $index) {
    <article class="timeline-card" [style.--delay]="i * 100 + 'ms'" data-reveal>
      <span class="timeline-index">{{ step.year }}</span>
      <div>
        <h3>{{ step.title }}</h3>
        <p>{{ step.copy }}</p>
      </div>
    </article>
    }
  </div>
</section>
