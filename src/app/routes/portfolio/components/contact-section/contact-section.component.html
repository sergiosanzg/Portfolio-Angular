<section class="contact-section" id="contact">
  <div class="contact-shell">
    <div class="contact-copy" data-reveal>
      <span class="eyebrow">{{ content.eyebrow }}</span>
      <h2>{{ content.title }}</h2>
      <p>{{ content.copy }}</p>

      <div class="contact-links">
        @for (link of contactLinks; track link.href) {
        <a
          class="contact-link"
          [href]="link.href"
          target="_blank"
          rel="noreferrer"
          (mouseenter)="onMouseEnter()"
          (mouseleave)="onMouseLeave()"
        >
          <span class="contact-link-brand">
            <i [class]="link.icon" aria-hidden="true"></i>
            <strong>{{ link.label }}</strong>
          </span>
          <span class="contact-link-handle">{{ link.value }}</span>
        </a>
        }
      </div>
    </div>

    <div class="contact-form-panel" data-reveal>
      <div class="form-header">
        <span class="panel-label">{{ content.panelLabel }}</span>
        <h3>{{ content.panelTitle }}</h3>
      </div>

      <form
        class="form-grid"
        (submit)="formSubmit.emit($event)"
        (mouseenter)="onMouseEnter()"
        (mouseleave)="onMouseLeave()"
      >
        <label class="field">
          <span>{{ content.nameLabel }}</span>
          <input type="text" name="user_name" [placeholder]="content.namePlaceholder" required />
        </label>
        <label class="field">
          <span>{{ content.emailLabel }}</span>
          <input type="email" name="user_email" placeholder="you@email.com" required />
        </label>
        <label class="field full">
          <span>{{ content.messageLabel }}</span>
          <textarea name="message" [placeholder]="content.messagePlaceholder" required></textarea>
        </label>
        <button class="btn primary submit" type="submit" [disabled]="isLoading">
          {{ isLoading ? content.submitLoading : content.submitIdle }}
        </button>
      </form>

      @if (statusMessage) {
      <div class="form-status">
        <div class="status-pill" [class.success]="statusType === 'success'" [class.error]="statusType === 'error'" [class.info]="statusType === 'info'">
          @if (isLoading) {
          <span class="status-spinner">
            <shared-loadging-spiner></shared-loadging-spiner>
          </span>
          }
          <span>{{ statusMessage }}</span>
        </div>
      </div>
      }
    </div>
  </div>
</section>
